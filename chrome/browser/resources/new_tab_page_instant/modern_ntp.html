<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kiwi Next</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0f1d;
      --bg-surface: rgba(18, 24, 38, 0.7);
      --bg-surface-elevated: rgba(30, 41, 59, 0.6);
      --bg-card-hover: rgba(51, 65, 85, 0.5);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(56, 189, 248, 0.3);
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --accent-kiwi: #4ade80;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --radius-full: 9999px;
      --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --blur-glass: blur(16px);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (prefers-color-scheme: light) {
      :root.theme-auto {
        --bg-primary: #f8fafc;
        --bg-surface: rgba(255, 255, 255, 0.8);
        --bg-surface-elevated: rgba(241, 245, 249, 0.9);
        --bg-card-hover: rgba(226, 232, 240, 0.8);
        --border-subtle: rgba(0, 0, 0, 0.08);
        --border-glow: rgba(14, 165, 233, 0.3);
        --accent: #0284c7;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #94a3b8;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(129, 140, 248, 0.12) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Header & Branding */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
      animation: fadeIn 0.6s ease-out;
    }

    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      background: var(--accent-gradient);
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.35);
    }

    .brand-logo svg {
      width: 32px;
      height: 32px;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--border-glow);
    }

    /* Modern Omnibox / Search Box */
    .search-section {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: slideUp 0.6s ease-out;
    }

    .search-card {
      background: var(--bg-surface);
      backdrop-filter: var(--blur-glass);
      -webkit-backdrop-filter: var(--blur-glass);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow-glass);
      transition: var(--transition);
    }

    .search-card:focus-within {
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(56, 189, 248, 0.25);
      transform: translateY(-1px);
    }

    .search-icon {
      color: var(--text-muted);
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 16px;
      font-weight: 400;
      padding: 8px 0;
      user-select: text;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-action-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 6px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }

    .search-action-btn:hover {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
    }

    /* Engine Selector Pills */
    .engine-pills {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .engine-pill {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .engine-pill:hover, .engine-pill.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: var(--border-glow);
    }

    /* Quick Launch Extensions & Shortcuts Grid */
    .section-title {
      align-self: flex-start;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-left: 8px;
    }

    .shortcuts-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 14px;
      animation: fadeIn 0.8s ease-out;
    }

    .shortcut-card {
      background: var(--bg-surface);
      backdrop-filter: var(--blur-glass);
      -webkit-backdrop-filter: var(--blur-glass);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
    }

    .shortcut-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-glow);
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
    }

    .shortcut-icon {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--bg-surface-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      color: var(--accent);
    }

    .shortcut-card:hover .shortcut-icon {
      transform: scale(1.08);
      background: rgba(56, 189, 248, 0.15);
    }

    .shortcut-name {
      font-size: 12px;
      font-weight: 500;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      color: var(--text-secondary);
    }

    .shortcut-card:hover .shortcut-name {
      color: var(--text-primary);
    }

    /* Productivity & Tablet Control Center */
    .dock-bar {
      margin-top: 10px;
      background: var(--bg-surface);
      backdrop-filter: var(--blur-glass);
      -webkit-backdrop-filter: var(--blur-glass);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: var(--shadow-glass);
    }

    .dock-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: var(--radius-full);
      transition: var(--transition);
    }

    .dock-item:hover {
      color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
    }

    .dock-divider {
      width: 1px;
      height: 18px;
      background: var(--border-subtle);
    }

    /* Keyframes */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="brand-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" stroke="#f8fafc" stroke-width="2"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" fill="#38bdf8"/>
        </svg>
      </div>
      <h1 class="brand-title">Kiwi Next</h1>
      <span class="brand-badge">Revived</span>
    </header>

    <!-- Search / Omnibox -->
    <section class="search-section">
      <form id="search-form" class="search-card" onsubmit="handleSearch(event)">
        <div class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <input 
          id="search-input" 
          class="search-input" 
          type="text" 
          placeholder="Search or enter URL..." 
          autocomplete="off" 
          autofocus
        />
        <button type="submit" class="search-action-btn" title="Go">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>

      <!-- Engine Selector -->
      <div class="engine-pills">
        <div class="engine-pill active" data-engine="google" onclick="setEngine('google')">Google</div>
        <div class="engine-pill" data-engine="duckduckgo" onclick="setEngine('duckduckgo')">DuckDuckGo</div>
        <div class="engine-pill" data-engine="bing" onclick="setEngine('bing')">Bing</div>
        <div class="engine-pill" data-engine="brave" onclick="setEngine('brave')">Brave</div>
        <div class="engine-pill" data-engine="ai" onclick="setEngine('ai')">✨ AI Assistant</div>
      </div>
    </section>

    <!-- Quick Shortcuts & Extensions -->
    <div class="section-title">Quick Access & Extensions</div>
    <main class="shortcuts-grid">
      <!-- Extensions Store -->
      <a class="shortcut-card" href="https://chromewebstore.google.com/">
        <div class="shortcut-icon" style="color: #60a5fa;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
            <line x1="12" y1="22.08" x2="12" y2="12"/>
          </svg>
        </div>
        <span class="shortcut-name">Web Store</span>
      </a>

      <!-- Manage Extensions -->
      <a class="shortcut-card" href="chrome://extensions">
        <div class="shortcut-icon" style="color: #a78bfa;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
        </div>
        <span class="shortcut-name">Extensions</span>
      </a>

      <!-- Bookmarks -->
      <a class="shortcut-card" href="chrome://bookmarks">
        <div class="shortcut-icon" style="color: #fbbf24;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="shortcut-name">Bookmarks</span>
      </a>

      <!-- History -->
      <a class="shortcut-card" href="chrome://history">
        <div class="shortcut-icon" style="color: #34d399;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
        <span class="shortcut-name">History</span>
      </a>

      <!-- Downloads -->
      <a class="shortcut-card" href="chrome://downloads">
        <div class="shortcut-icon" style="color: #38bdf8;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        <span class="shortcut-name">Downloads</span>
      </a>

      <!-- Settings -->
      <a class="shortcut-card" href="chrome://settings">
        <div class="shortcut-icon" style="color: #f472b6;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </div>
        <span class="shortcut-name">Settings</span>
      </a>

      <!-- GitHub -->
      <a class="shortcut-card" href="https://github.com">
        <div class="shortcut-icon" style="color: #cbd5e1;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
          </svg>
        </div>
        <span class="shortcut-name">GitHub</span>
      </a>

      <!-- Flags -->
      <a class="shortcut-card" href="chrome://flags">
        <div class="shortcut-icon" style="color: #f87171;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/>
            <line x1="4" y1="22" x2="4" y2="15"/>
          </svg>
        </div>
        <span class="shortcut-name">Flags</span>
      </a>
    </main>

    <!-- Bottom Dock -->
    <nav class="dock-bar">
      <div class="dock-item" onclick="toggleTheme()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <span>Theme</span>
      </div>
      <div class="dock-divider"></div>
      <a class="dock-item" href="chrome://flags/#enable-gpu-rasterization">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>144Hz Turbo</span>
      </a>
      <div class="dock-divider"></div>
      <a class="dock-item" href="https://github.com/kiwibrowser/src.next">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span>About</span>
      </a>
    </nav>
  </div>

  <script>
    let currentEngine = 'google';
    const engines = {
      google: 'https://www.google.com/search?q=',
      duckduckgo: 'https://duckduckgo.com/?q=',
      bing: 'https://www.bing.com/search?q=',
      brave: 'https://search.brave.com/search?q=',
      ai: 'https://duckduckgo.com/?q=!ai+'
    };

    function setEngine(name) {
      currentEngine = name;
      document.querySelectorAll('.engine-pill').forEach(el => {
        el.classList.toggle('active', el.dataset.engine === name);
      });
      const input = document.getElementById('search-input');
      input.placeholder = name === 'ai' ? 'Ask AI anything...' : 'Search with ' + name.charAt(0).toUpperCase() + name.slice(1) + ' or type URL';
      input.focus();
    }

    function handleSearch(event) {
      event.preventDefault();
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      if (/^(https?:\/\/|[a-z0-9]+([\-\.]{1}[a-z0-9]+)*\.[a-z]{2,5}(:[0-9]{1,5})?(\/.*)?$)/i.test(query)) {
        let url = query;
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        window.location.href = url;
      } else {
        const baseUrl = engines[currentEngine] || engines.google;
        window.location.href = baseUrl + encodeURIComponent(query);
      }
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('theme-auto');
    }
  </script>
</body>
</html>
