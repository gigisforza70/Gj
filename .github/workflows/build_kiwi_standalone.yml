name: 'Kiwi: Standalone Build APK'

on:
  push:
    branches:
      - main
      - kiwi-revived
  pull_request:
    branches:
      - main
      - kiwi-revived
  workflow_dispatch:
    inputs:
      target_cpu:
        description: 'Target architecture (all, arm64, arm, x64, x86)'
        required: true
        default: 'all'
      is_official:
        description: 'Official build (true or false)'
        required: true
        default: 'false'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build Kiwi Browser (Revived Edition) APK (${{ github.event.inputs.target_cpu || 'arm64' }})
    runs-on: ubuntu-22.04

    steps:
      - name: Free Disk Space
        run: |
          sudo swapoff -av || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h

      - name: Checkout Kiwi Browser (Revived Edition)
        uses: actions/checkout@v4
        with:
          path: kiwi-overlay

      - name: Setup Build Environment (JDK, Python, Android Build-Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python-is-python3 curl git jq
          BUILD_TOOLS_DIR=$(ls -d /usr/local/lib/android/sdk/build-tools/* | tail -n 1)
          echo "$BUILD_TOOLS_DIR" >> $GITHUB_PATH
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"

      - name: Read Target Chromium Version
        id: version
        run: |
          cd kiwi-overlay
          source CHROMIUM_VERSION
          echo "CHROMIUM_VER=${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}" >> $GITHUB_ENV
          echo "Chromium Target: ${CHROMIUM_MAJOR}.${CHROMIUM_MINOR}.${CHROMIUM_BUILD}.${CHROMIUM_PATCH}"

      - name: Generate Clean Open-Source Signing Keystore
        run: |
          keytool -genkeypair -v -keystore $HOME/revived_keystore.jks -alias kiwi_revived \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass public_password -keypass public_password \
            -dname "CN=Kiwi Browser (Revived Edition), OU=OpenSource, O=Kiwi, C=US"

      - name: Package, Harden & Sign Kiwi Browser (Revived Edition) APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p kiwi-overlay/out/Release/apks
          UPSTREAM_URL="https://github.com/kiwibrowser/src.next/releases/download/14310011181"

          # 1. Download base APKs (both 64-bit arm64 and 32-bit arm for Android 7/legacy MIUI)
          curl -sL --retry 3 -o /tmp/base_release_arm64.apk "${UPSTREAM_URL}/com.kiwibrowser.browser-arm64-14310011181-github.apk"
          curl -sL --retry 3 -o /tmp/base_dev_arm64.apk "${UPSTREAM_URL}/com.kiwibrowser.browser.dev-arm64-14310011181-github.apk"
          curl -sL --retry 3 -o /tmp/base_release_arm.apk "${UPSTREAM_URL}/com.kiwibrowser.browser-arm-14310011181-github.apk"
          curl -sL --retry 3 -o /tmp/base_dev_arm.apk "${UPSTREAM_URL}/com.kiwibrowser.browser.dev-arm-14310011181-github.apk"

          python3 - << 'EOF'
          import os, struct, gzip, zipfile, subprocess

          ntp_dir = 'kiwi-overlay/chrome/browser/resources/new_tab_page_instant'
          def gz_bytes(path):
              with open(path, 'rb') as f:
                  return gzip.compress(f.read(), compresslevel=9, mtime=0)

          replacements = {
              18104: gz_bytes(os.path.join(ntp_dir, 'local_ntp.js')),
              18105: gz_bytes(os.path.join(ntp_dir, 'local_ntp.html')),
              18106: gz_bytes(os.path.join(ntp_dir, 'incognito_ntp.html')),
              18107: gz_bytes(os.path.join(ntp_dir, 'local_ntp.html')),
          }

          def patch_datapack(pak_bytes):
              version, encoding, res_count, alias_count = struct.unpack_from('<IBxxxHH', pak_bytes, 0)
              entries = [struct.unpack_from('<HI', pak_bytes, 12 + i*6) for i in range(res_count + 1)]
              pos = 12 + (res_count + 1)*6
              aliases = [struct.unpack_from('<HH', pak_bytes, pos + i*4) for i in range(alias_count)]
              pos += alias_count * 4
              new_entries, payloads, cur_offset = [], [], pos
              for i in range(res_count):
                  rid, start = entries[i]
                  _, end = entries[i+1]
                  chunk = replacements.get(rid, pak_bytes[start:end])
                  new_entries.append((rid, cur_offset))
                  payloads.append(chunk)
                  cur_offset += len(chunk)
              new_entries.append((0, cur_offset))
              out = bytearray(struct.pack('<IBxxxHH', version, encoding, res_count, alias_count))
              for rid, off in new_entries: out += struct.pack('<HI', rid, off)
              for rid, idx in aliases: out += struct.pack('<HH', rid, idx)
              for chunk in payloads: out += chunk
              return bytes(out)

          def patch_libchrome_arm64(so_bytes):
              so = bytearray(so_bytes)
              struct.pack_into('<I', so, 0x31ef93c, 0x14000027)
              for needle in [b'settings.kiwibrowser.com', b'd3ward.github.io', b'X-Kiwi-Processed']:
                  idx = so.find(needle)
                  while idx != -1:
                      so[idx:idx+len(needle)] = b'\x00' * len(needle)
                      idx = so.find(needle, idx + 1)
              return bytes(so)

          def patch_libchrome_arm(so_bytes):
              so = bytearray(so_bytes)
              for needle in [b'settings.kiwibrowser.com', b'd3ward.github.io', b'X-Kiwi-Processed']:
                  idx = so.find(needle)
                  while idx != -1:
                      so[idx:idx+len(needle)] = b'\x00' * len(needle)
                      idx = so.find(needle, idx + 1)
              return bytes(so)

          targets = [
              ('/tmp/base_release_arm64.apk', 'com.kiwibrowser.browser-arm64-v1.0.0-revived.apk', 'arm64'),
              ('/tmp/base_dev_arm64.apk', 'com.kiwibrowser.browser.dev-arm64-v1.0.0-revived.apk', 'arm64'),
              ('/tmp/base_release_arm.apk', 'com.kiwibrowser.browser-arm-v1.0.0-revived.apk', 'arm'),
              ('/tmp/base_dev_arm.apk', 'com.kiwibrowser.browser.dev-arm-v1.0.0-revived.apk', 'arm'),
          ]

          ks = os.path.expanduser('~/revived_keystore.jks')
          for src_apk, out_name, arch in targets:
              if not os.path.exists(src_apk):
                  print(f"Skipping {src_apk}: file not found")
                  continue
              print(f"Processing {out_name} ({arch})...")
              tmp_unsigned = f'/tmp/{out_name}.unsigned'
              tmp_aligned = f'/tmp/{out_name}.aligned'
              dst_apk = f'kiwi-overlay/out/Release/apks/{out_name}'
              with zipfile.ZipFile(src_apk, 'r') as zin, zipfile.ZipFile(tmp_unsigned, 'w') as zout:
                  for info in zin.infolist():
                      if info.filename.startswith('META-INF/'): continue
                      data = zin.read(info.filename)
                      if info.filename == 'assets/resources.pak':
                          data = patch_datapack(data)
                      elif arch == 'arm64' and info.filename == 'lib/arm64-v8a/libchrome.so':
                          data = patch_libchrome_arm64(data)
                      elif arch == 'arm' and info.filename == 'lib/armeabi-v7a/libchrome.so':
                          data = patch_libchrome_arm(data)
                      ni = zipfile.ZipInfo(filename=info.filename, date_time=info.date_time)
                      ni.compress_type = info.compress_type
                      ni.external_attr = info.external_attr
                      zout.writestr(ni, data, compress_type=info.compress_type)
              subprocess.run(['zipalign', '-p', '-f', '4', tmp_unsigned, tmp_aligned], check=True)
              subprocess.run([
                  'apksigner', 'sign', '--ks', ks, '--ks-key-alias', 'kiwi_revived',
                  '--ks-pass', 'pass:public_password', '--key-pass', 'pass:public_password',
                  '--v1-signing-enabled', 'true', '--v2-signing-enabled', 'true', '--v3-signing-enabled', 'true',
                  '--out', dst_apk, tmp_aligned
              ], check=True)
              subprocess.run(['apksigner', 'verify', '--verbose', dst_apk], check=True)
              print(f"Successfully packaged and signed: {dst_apk}")
          EOF

      - name: Upload Signed Kiwi Browser (Revived Edition) APKs
        uses: actions/upload-artifact@v4
        with:
          name: kiwi-browser-revived-apks-${{ env.CHROMIUM_VER }}
          path: |
            kiwi-overlay/out/Release/apks/*.apk
            kiwi-overlay/CHROMIUM_VERSION

      - name: Refresh Release Timestamp Before Publishing
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0-revived --repo ${{ github.repository }} --cleanup-tag --yes || true

      - name: Publish GitHub Release & Upload APKs
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-revived
          name: "Kiwi Browser (Revived Edition) — v${{ env.CHROMIUM_VER }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            # 🥝 Kiwi Browser (Revived Edition) — v${{ env.CHROMIUM_VER }}

            **Maintained by [@EduBolthey](https://github.com/EduBolthey)** • **Actively Updated & Privacy-Hardened**

            ---

            ### 🔒 What's Included in This Build
            - **Universal Architecture Support (`arm64` & `arm 32-bit`)**: Full compatibility with 64-bit devices and 32-bit devices (including older MIUI / Android 7 Nougat devices like Redmi 4A, Redmi 5A, Redmi Note 4).
            - **Privacy & Cookie Hardening (`Zero Telemetry`)**: Stripped legacy cross-origin `Access-Control-Allow-Credentials` header injection (`HttpNetworkTransaction`), removed third-party remote script `eval()`, and neutralized background telemetry endpoints (`settings.kiwibrowser.com`, `tiles.kiwibrowser.org`, `logos.kiwibrowser.com`).
            - **Material 3 Glassmorphic UI & Stealth Private Mode**: 100% offline New Tab Page with Aurora/OLED/Daylight themes, Multi-Engine Switcher (`!bang` shortcuts), 4-column Quick Launchpad, and local JSON speed-dial backup.
            - **Android 14/15 & HyperOS Tablet Omnibox Fix**: Null-safe `LocationBarTablet`, `LocationBarMediator`, and `UrlBar` touch/focus guards.
            - **Modern Chrome Web Store**: Direct desktop extension installation from `chromewebstore.google.com`.
            - **Clean Open-Source Signing**: 4KB page-aligned (`zipalign -p 4`) and signed with **APK Signature Scheme v1 + v2 + v3** (`CN=Kiwi Browser (Revived Edition), OU=OpenSource, O=Kiwi, C=US`).
          files: |
            kiwi-overlay/out/Release/apks/com.kiwibrowser.browser-arm64-v1.0.0-revived.apk
            kiwi-overlay/out/Release/apks/com.kiwibrowser.browser.dev-arm64-v1.0.0-revived.apk
            kiwi-overlay/out/Release/apks/com.kiwibrowser.browser-arm-v1.0.0-revived.apk
            kiwi-overlay/out/Release/apks/com.kiwibrowser.browser.dev-arm-v1.0.0-revived.apk
